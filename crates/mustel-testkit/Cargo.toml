[package]
name = "mustel-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Harness de paridade do Mustel: fixtures, oráculo (.NET) e comparação"
publish = false

# Fora do ciclo de release: não vai ao crates.io e não é um pacote a versionar/publicar.
[package.metadata.release]
release = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
dirs = "7"
anyhow = "1"
mustel-core = { path = "../mustel-core", version = "1.0.0" }

[dev-dependencies]
tempfile = "3"
