name: Parity (oracle)

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compat:
    name: Oracle parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Build mustel (debug, para o comparador localizar)
        run: cargo build -p mustel

      - name: Capture baseline from the legacy oracle
        run: cargo run -p mustel-testkit --bin oracle-capture

      - name: Compare mustel against the baseline
        run: cargo run -p mustel-testkit --bin oracle-compare

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ matrix.os }}
          path: oracle/reports/**/report.md
          if-no-files-found: warn
