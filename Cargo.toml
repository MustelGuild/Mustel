[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/MustelGuild/Mustel"
authors = ["liphvf"]

[workspace.lints.rust]
unsafe_code = "forbid"
# Variável/import/constante/`dead_code` privado viram erro: a garantia contra "sobra de IA".
unused = { level = "deny", priority = -1 }
# `pub` que não é alcançável de fora de uma lib é superfície acidental (0 em `src/` hoje).
unreachable_pub = "warn"
# API pública documentada (Rust API Guidelines C-CRATE-DOC).
missing_docs = "warn"

[workspace.lints.clippy]
# `all` cobre correctness/suspicious/style/complexity/perf (o padrão do Clippy).
all = "warn"
# Recorte de alto sinal: duplicação e código que esconde problema. `pedantic` inteiro é ruído
# (1.003 avisos, 459 só de `must_use_candidate`); a decisão está em MustelPlans/lints-fase-1.md.
match_same_arms = "warn"
if_same_then_else = "warn"
redundant_clone = "warn"
similar_names = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Versão e tag de release pelo `cargo-release` (D29).
#
# O fluxo é: `cargo release patch --execute` → incrementa `workspace.package.version`, atualiza o
# `Cargo.lock` e as dependências internas, commita e cria a tag local `v<versao>`. O push da tag, o
# empacotamento e a criação da release no GitHub são atos manuais do dono; a publicação no crates.io
# é passo separado porque é irreversível.
[workspace.metadata.release]
# Uma versão para o workspace inteiro: os crates declaram `version.workspace = true`.
shared-version = true
# A tag precisa casar com o nome do artefato; a conferência é manual, no release.
tag-name = "v{{version}}"
tag-message = "Mustel {{version}}"
pre-release-commit-message = "Bump Mustel to {{version}}"
# Uma release só sai do branch principal.
allow-branch = ["main"]
# Path deps (mustel-core, mustel-gui) acompanham a versão compartilhada.
dependent-version = "upgrade"
# Não publica no crates.io: `cargo publish` é irreversível e exige token, então é passo explícito
# (ver docs/how-to/publicar-release.md).
publish = false
# Não empurra para o remoto: push é ação do dono (guard rails do AGENTS.md).
push = false
# A verificação é o gate: `cargo release` verificaria com `cargo publish --dry-run`, que falha
# enquanto as dependências internas não estiverem publicadas — o que só acontece no primeiro
# release.
verify = false

# Dependências compartilhadas: declaradas pelo crate que as usa.
# `mustel-testkit` não é publicado (publish = false).
