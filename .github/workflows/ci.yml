name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLORS: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  legacy:
    name: Legacy .NET oracle still builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore legacy/FurLab.slnx

      - name: Build (Release, empacota)
        run: dotnet build legacy/FurLab.slnx -c Release --no-restore

      - name: Test
        run: dotnet test legacy/FurLab.slnx -c Release --no-build
