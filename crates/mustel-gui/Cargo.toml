[package]
name = "mustel-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mustel GUI (egui) — frontend gráfico sobre o mustel-core"

[lints]
workspace = true

[dependencies]
mustel-core = { path = "../mustel-core", version = "1.0.0" }
# `glow` (OpenGL) em vez do `wgpu` padrão: o app desenha uma janela só e o backend leve
# compila em uma fração do tempo, o que importa porque a crate entra no build do `mustel`.
#
# `clipboard` **não** é opcional na prática: sem ele o `egui-winit` não liga a área de transferência
# e Ctrl+V/Ctrl+C (e o `copy_text` do botão "Copy path") ficam inertes. `system_fonts` e os backends
# `x11`/`wayland` vêm junto para o binário não ficar pior que o padrão do eframe no Linux.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "system_fonts",
    "x11",
    "wayland",
] }
egui = "0.37"
# `fontique` já vem compilada como dependência do `egui_system_font_provider` (feature `system_fonts`
# do eframe). Declarada aqui direto para **enumerar** as famílias instaladas e carregar os bytes da
# que o usuário escolher na aba Settings — sem custo novo de compilação, mesma versão do `Cargo.lock`.
fontique = "0.11"
# `TableBuilder`: tabela com cabeçalho fixo, colunas redimensionáveis e linhas virtualizadas — o
# `ScrollArea::show_rows` sozinho punha a barra de rolagem no meio da tela, na largura do conteúdo.
egui_extras = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# Só para o teste de integração gated ler a `MUSTEL_PG_TEST_URL` com o mesmo parser do driver.
tokio-postgres = "0.7"

[package.metadata.release]
# Release é bump+commit+tag: a publicação no crates.io é passo explícito (docs/how-to/publicar-release.md).
publish = false
push = false
