[package]
name = "mustel"
version = "0.1.0"
edition = "2021"
authors = ["Mustel Team"]
description = "Personal CLI toolkit for database management, query execution, and automation"

[dependencies]
# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env", "color"] }
indicatif = "0.17"
inquire = "0.7"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async Runtime & Utilities
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
tokio-stream = "0.1"
futures-util = "0.3"

# PostgreSQL Database Client
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.12"
rustls = "0.23"
webpki-roots = "0.26"

# Serialization, Config, UUID & CSV
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = "1.8"
directories = "5.0"

# Security, SQL Parsing & Validation
sqlparser = "0.47"
regex = "1.10"
glob = "0.3"
thiserror = "2.0.19"
anyhow = "1.0.104"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Windows DPAPI & Cryptography
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Foundation"
] }

# Error Handling

[dev-dependencies]
tempfile = "3.10.1"
