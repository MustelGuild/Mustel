[package]
name = "mustel"
version = "0.1.0"
edition = "2021"
authors = ["Mustel Team"]
description = "Personal CLI toolkit for database management, query execution, and automation"

[dependencies]
# CLI & Terminal UI
clap = { version = "4.6", features = ["derive", "env", "color"] }
indicatif = "0.18"
inquire = "0.9"
colored = "3.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async Runtime & Utilities
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"
tokio-stream = "0.1"
futures-util = "0.3"

# PostgreSQL Database Client
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
rustls = "0.23"
webpki-roots = "1.0"

# Serialization, Config, UUID & CSV
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
csv = "1.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = "1.16"
directories = "6.0"

# Security, SQL Parsing & Validation
sqlparser = "0.62"
regex = "1.11"
glob = "0.3"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Windows DPAPI & Cryptography
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Foundation"
] }

[dev-dependencies]
tempfile = "3.27"
