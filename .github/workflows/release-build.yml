# Empacota o executável do Mustel e **cria a release no GitHub** com os artefatos.
#
# **Só roda quando alguém pede** (`workflow_dispatch`, o botão "Run workflow"): as portas de
# qualidade (fmt/clippy/test, paridade com o oráculo) continuam rodando **à mão**, como decidido no
# D24 — foi o que tirou o ruído de CI vermelho durante o desenvolvimento. Este workflow produz o
# artefato **e** o publica na página de release; o `cargo publish` continua manual.
#
# Uso: informe a tag (`v1.0.0`). O job de release confere que o nome do artefato (que vem da versão
# do `Cargo.toml`) casa com a tag antes de publicar — tag e versão divergentes falham ali, e não na
# mão de quem baixa.
#
# Plataformas: Windows (`windows-latest`) e Linux (`ubuntu-latest`). O `publish.sh` já cobre Unix; o
# binário Linux carrega a pilha gráfica, então as libs de sistema entram abaixo.
name: release-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: empacotar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache do cargo
        uses: Swatinem/rust-cache@v2

      # O binário carrega o `egui`/`eframe` (feature `gui`, ligada por padrão), então o build Unix
      # precisa das bibliotecas de sistema da pilha gráfica: sem elas o link falha (dbus, X11/Wayland
      # e GL). No Windows essas dependências já vêm no runner.
      - name: dependências do GUI (Unix)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./publish.ps1

      - name: empacotar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./publish.sh

      - name: guardar o artefato do job
        uses: actions/upload-artifact@v4
        with:
          name: mustel-${{ matrix.os }}
          path: |
            packaging/*.zip
            packaging/*.tar.gz
            packaging/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publicar na página de release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: baixar os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # O `publish.ps1`/`publish.sh` nomeiam o arquivo com a versão do `Cargo.toml`
      # (`mustel-<versao>-<triple>`). Tag `v1.0.0` sem artefato `-1.0.0-` é release errada: falha
      # aqui, antes de publicar.
      - name: conferir tag × versão do artefato
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          count=$(ls dist | wc -l)
          [ "$count" -gt 0 ] || { echo "nenhum artefato baixado"; exit 1; }
          if ! ls dist | grep -q -- "-$version-"; then
            echo "a tag '$TAG' não casa com a versão dos artefatos:"
            ls dist
            exit 1
          fi
          echo "ok: $count artefato(s) para $TAG"

      - name: listar o que será publicado
        run: ls -l dist

      - name: criar a release e anexar os artefatos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Mustel ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
