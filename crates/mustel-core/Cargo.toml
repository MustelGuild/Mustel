[package]
name = "mustel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mustel core: configuração, credenciais, Postgres e casos de uso — sem UI"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "sync", "io-util"] }
tokio-util = "0.7"

# keyring 3.x não habilita backend nenhum por padrão: sem estas features por plataforma ele usa um
# store mock que aceita `set` e devolve `None` no `get` (falha silenciosa). Ver T7 no plano.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Plataformas sem backend nativo continuam compilando; `get`/`set` falham com mensagem clara.
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "linux")))'.dependencies]
keyring = "3"

[dev-dependencies]
tempfile = "3"
