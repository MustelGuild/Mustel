# QA Gate do Mustel. Roda de duas formas:
#   - manual, pelo botão "Run workflow" na aba Actions (`workflow_dispatch`);
#   - chamado pelo `publish.yml` (`workflow_call`), antes de empacotar a release.
# Push e pull request não disparam nada. As actions são pinadas por SHA (o comentário diz a versão)
# para que uma tag re-apontada não execute código com o token do repositório.
name: QA Gate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Ref (branch ou tag) a verificar; vazio usa o ref do disparo'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  gate:
    name: fmt, clippy, test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O `publish` passa a tag: o gate precisa testar exatamente o commit que vira release,
          # não o branch que estava selecionado na hora do clique.
          ref: ${{ inputs.ref || github.ref }}
      - name: instalar Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: rustfmt, clippy
      - name: cache do cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: formatação
        run: cargo fmt --all -- --check
      - name: lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: testes
        run: cargo test --workspace

  dependencies:
    name: dependências (RustSec) e licenças
    # Fixo em 24.04: o `ubuntu-latest` migra de imagem sozinho e a base de um gate não deve mudar
    # sem alguém decidir isso.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: instalar Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      - name: auditoria RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: licenças e fontes
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources bans
