name: mustel-smoke

services:
  postgres:
    build: .
    image: mustel-smoke-postgres:local
    container_name: mustel-smoke-postgres
    networks:
      default:
        aliases:
          - postgres-wrong
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/server.key
    healthcheck:
      # O marcador só existe depois que as 100+ bases terminaram de ser criadas.
      test: ["CMD-SHELL", "test -f /tmp/smoke-init.done && pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  smoke:
    build:
      context: .
      dockerfile: runner.Dockerfile
    image: mustel-smoke-runner:local
    container_name: mustel-smoke-runner
    depends_on:
      postgres:
        condition: service_healthy
      postgres-notls:
        condition: service_healthy
    working_dir: /src
    environment:
      CARGO_TARGET_DIR: /tmp/target
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ..:/src:ro
      - ./out:/out
      - target:/tmp/target
    entrypoint: ["/bin/bash", "/src/smoke/run.sh"]

  postgres-notls:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: mustel-smoke-postgres-notls
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: smoke_notls
    command:
      - postgres
      - -c
      - ssl=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  target:
