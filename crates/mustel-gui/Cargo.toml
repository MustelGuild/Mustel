[package]
name = "mustel-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mustel GUI (egui) — frontend gráfico sobre o mustel-core"

[lints]
workspace = true

[dependencies]
mustel-core = { path = "../mustel-core", version = "1.0.0" }
# `glow` (OpenGL) em vez do `wgpu` padrão: o app desenha uma janela só e o backend leve
# compila em uma fração do tempo, o que importa porque a crate entra no build do `mustel`.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# Só para o teste de integração gated ler a `MUSTEL_PG_TEST_URL` com o mesmo parser do driver.
tokio-postgres = "0.7"
