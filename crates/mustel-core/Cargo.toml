[package]
name = "mustel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mustel core: configuração, credenciais, Postgres e casos de uso — sem UI"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
thiserror = "2"
regex = "1"
url = "2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-native-certs = "0.8"
sqlparser = "0.63"
# `Stream`/`FuturesUnordered` para o `query run` (T34): o resultado do driver chega como fluxo de
# linhas (memória estável em export grande) e o executor junta as consultas paralelas.
futures-util = "0.3"
# `numeric` não tem `FromSql` no driver; o `rust_decimal` (feature `db-postgres`) traz o do
# `numeric` e um `Display` que **preserva a escala** — o CSV do oráculo mostra `0.00`, não `0`.
rust_decimal = { version = "1", features = ["db-postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "sync", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

# keyring 4 com a feature default `v1` escolhe sozinho o backend nativo da plataforma
# (Credential Manager no Windows, Keychain no macOS, Secret Service no Linux) e mantém a API
# `Entry`/`Error` da versão 3. Em plataforma sem store, `Entry::new` devolve erro em vez de
# aceitar `set` e perder o segredo no `get`.
#
# No Linux o store do `v1` é o `zbus-secret-service`, que implementa D-Bus em Rust puro: não há
# `libdbus-sys` no grafo, então o build dispensa o `dbus-1.pc` (`dbus-devel`/`libdbus-1-dev`) e o
# binário não carrega `libdbus-1.so.3` em runtime (B1).
keyring = "4"

# `killpg` para derrubar a **árvore** de um processo no cancelamento (T27). É API segura sobre a
# syscall: o utilitário `kill` com pid negativo se mostrou não confiável na prática (testado em
# container: `/bin/kill -KILL -<pid>` sai com 0 e **não** mata o grupo; o builtin do shell mata),
# e `libc::kill` direto não é opção por causa de `unsafe_code = "forbid"`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.release]
# Release é bump+commit+tag: a publicação no crates.io é passo explícito (docs/how-to/publicar-release.md).
publish = false
push = false
