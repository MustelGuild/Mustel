name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore legacy/FurLab.slnx

      - name: Build
        run: dotnet build legacy/FurLab.slnx -c Release --no-restore

      - name: Test
        run: dotnet test legacy/FurLab.slnx -c Release --no-build
