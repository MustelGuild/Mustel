[package]
name = "mustel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mustel core: configuração, credenciais, Postgres e casos de uso — sem UI"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
regex = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# `Stream`/`FuturesUnordered` para o `query run` (T34): o resultado do driver chega como fluxo de
# linhas (memória estável em export grande) e o executor junta as consultas paralelas.
futures-util = "0.3"
# `numeric` não tem `FromSql` no driver; o `rust_decimal` (feature `db-postgres`) traz o do
# `numeric` e um `Display` que **preserva a escala** — o CSV do oráculo mostra `0.00`, não `0`.
rust_decimal = { version = "1", features = ["db-postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "sync", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

# keyring 3.x não habilita backend nenhum por padrão: sem estas features por plataforma ele usa um
# store mock que aceita `set` e devolve `None` no `get` (falha silenciosa). Ver T7 no plano.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Plataformas sem backend nativo continuam compilando; `get`/`set` falham com mensagem clara.
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "linux")))'.dependencies]
keyring = "3"

# `killpg` para derrubar a **árvore** de um processo no cancelamento (T27). É API segura sobre a
# syscall: o utilitário `kill` com pid negativo se mostrou não confiável na prática (testado em
# container: `/bin/kill -KILL -<pid>` sai com 0 e **não** mata o grupo; o builtin do shell mata),
# e `libc::kill` direto não é opção por causa de `unsafe_code = "forbid"`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.release]
# Release é bump+commit+tag: a publicação no crates.io é passo explícito (docs/how-to/publicar-release.md).
publish = false
push = false
